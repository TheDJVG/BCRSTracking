stages:
  - lint
  - test
  - build
  - helm

lint:
  stage: lint
  image: golang:1.27-alpine
  script:
    - go vet ./...

test:
  stage: test
  image: golang:1.27-alpine
  script:
    - apk add --no-cache gcc musl-dev
    - go test -race -v -coverprofile=coverage.out ./...

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-lint:
  stage: helm
  image: alpine/helm:3.21.4
  script:
    - helm lint deployments/helm/bcrstracking

helm-publish:
  stage: helm
  image: alpine/helm:3.21.4
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        CHART_VERSION="${CI_COMMIT_TAG#v}"
        APP_VERSION="${CI_COMMIT_TAG}"
      else
        CHART_VERSION="0.1.0-${CI_COMMIT_SHORT_SHA}"
        APP_VERSION="${CI_COMMIT_SHORT_SHA}"
      fi
    - echo "$CI_REGISTRY_PASSWORD" | helm registry login "${CI_REGISTRY}" -u "$CI_REGISTRY_USER" --password-stdin
    - helm package deployments/helm/bcrstracking --version "$CHART_VERSION" --app-version "$APP_VERSION" --destination /tmp
    - helm push /tmp/bcrstracking-${CHART_VERSION}.tgz "oci://${CI_REGISTRY_IMAGE}"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
