{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bcrstracking.fullname" . }}-dashboard
  labels:
    {{- include "bcrstracking.labels" . | nindent 4 }}
    {{- with .Values.grafana.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  bcrs-overview.json: |-
{{ .Files.Get "dashboards/bcrs-overview.json" | indent 4 }}
{{- end }}
