{{- if .Values.victoriaMetrics.rules.enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "bcrstracking.fullname" . }}
  labels:
    {{- include "bcrstracking.labels" . | nindent 4 }}
    {{- with .Values.victoriaMetrics.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: bcrstracking.alerts
      rules:
        - alert: BCRSPollCycleFailing
          expr: increase(bcrs_poll_cycle_total{result="error"}[10m]) > 3
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "BCRS scrape cycle encountering errors"
            description: "Poll cycle error count exceeded 3 in the last 10 minutes."

        - alert: BCRSRateLimitExhausted
          expr: increase(bcrs_rate_limit_backoffs_total[10m]) > 5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "BCRS scraper rate limit exhausted"
            description: "Scraper has triggered > 5 rate limit backoff events in 10 minutes."

        - alert: BCRSClickHouseInsertErrors
          expr: increase(bcrs_clickhouse_errors_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "ClickHouse batch insert error"
            description: "ClickHouse batch writer is encountering insertion errors."

        - alert: BCRSBufferDepthHigh
          expr: bcrs_clickhouse_buffer_depth > 1000
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "ClickHouse pending buffer depth high"
            description: "Pending rows in ClickHouse batch buffer exceeds 1000 items."

        - alert: BCRSUpstreamAPIFailing
          expr: sum(rate(bcrs_http_requests_total{status_code=~"5.."}[5m])) / (sum(rate(bcrs_http_requests_total[5m])) > 0) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "BCRS upstream API failing"
            description: "Upstream BCRS API 5xx failure rate exceeds 10% for the last 5 minutes."

        - alert: BCRSScrapeStalled
          expr: (time() - max(bcrs_poll_cycle_last_success_timestamp_seconds{type="bins"})) > 1200
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "BCRS bin scrape stalled"
            description: "Bin scrape cycle has not completed successfully for over 20 minutes."
{{- end }}
